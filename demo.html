<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closr Product Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1d7fc3;
    --primary-lite: #c6dff0;
    --secondary: #ff8800;
    --ink: #15171a;
    --ink-muted: #5c6167;
    --paper: #f9fafb;
    --surface: #ffffff;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }
  img, video { max-width: 100%; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .logo { height: 28px; width: auto; display: block; }

  nav.tabs {
    position: sticky; top: 61px; z-index: 19;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 4px; overflow-x: auto;
    padding: 0 16px;
    scrollbar-width: thin;
  }
  nav.tabs button {
    appearance: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 13px;
    color: var(--ink-muted);
    padding: 14px 14px 12px;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 120ms ease, border-color 120ms ease;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-selected="true"] {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .panel-head { margin-bottom: 28px; }
  .eyebrow {
    font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--primary); margin: 0 0 6px;
  }
  .panel-head h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -0.01em;
    margin: 0 0 8px; text-wrap: balance;
  }
  .panel-head p {
    font-size: 15px; line-height: 1.6; color: var(--ink-muted);
    margin: 0; max-width: 62ch;
  }

  .clip { margin-bottom: 40px; }
  .clip:last-child { margin-bottom: 0; }
  .clip h3 {
    font-size: 14px; font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .clip h3::before {
    content: ""; width: 8px; height: 8px; border-radius: 2px;
    background: var(--primary); flex-shrink: 0;
  }
  .clip video {
    width: 100%; display: block;
    border: 1px solid var(--line); border-radius: 6px;
    background: #000;
  }
  .clip p.cap {
    margin: 8px 0 0; font-size: 13px; color: var(--ink-muted); line-height: 1.5;
  }

  /* explain-only content */
  .feature-list { display: flex; flex-direction: column; }
  .feature-row {
    display: grid; grid-template-columns: 28px 1fr; gap: 14px;
    padding: 18px 0; border-top: 1px solid var(--line);
  }
  .feature-row:first-child { border-top: none; padding-top: 0; }
  .feature-row .n { font-size: 12px; font-weight: 700; color: #9ca3af; padding-top: 2px; }
  .feature-row h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .feature-row p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-muted); max-width: 58ch; }
  .status {
    display: inline-block; font-size: 10px; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; margin-left: 8px; vertical-align: middle;
  }
  .status.shipped { background: #e8f7ee; color: #16a34a; }
  .status.roadmap { background: #fff4e5; color: var(--secondary); }

  .grid3 {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .grid3 .cell {
    padding: 18px; border-left: 1px solid var(--line);
  }
  .grid3 .cell:nth-child(3n+1) { border-left: none; }
  .grid3 .letter { font-size: 22px; font-weight: 800; color: var(--primary); }
  .grid3 h4 { margin: 8px 0 4px; font-size: 13px; font-weight: 700; }
  .grid3 p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-muted); }
  @media (max-width: 640px) {
    .grid3 { grid-template-columns: 1fr; }
    .grid3 .cell { border-left: none; border-top: 1px solid var(--line); }
    .grid3 .cell:first-child { border-top: none; }
  }

  .callout {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--primary); border-radius: 6px;
    padding: 16px 18px; margin-top: 24px;
  }
  .callout p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-muted); }

  /* roadmap */
  .phase { margin-bottom: 32px; }
  .phase-head {
    display: flex; align-items: baseline; gap: 12px;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px;
  }
  .phase-num {
    font-size: 11px; font-weight: 800; background: var(--ink); color: #fff;
    padding: 3px 8px; border-radius: 4px;
  }
  .phase-head h3 { margin: 0; font-size: 18px; font-weight: 800; flex: 1; }
  .phase-when { font-size: 11px; font-weight: 700; color: var(--ink-muted); white-space: nowrap; }
  .phase-goal { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-muted); line-height: 1.55; max-width: 62ch; }
  .phase ul { margin: 0; padding-left: 18px; }
  .phase li { font-size: 13.5px; color: var(--ink); line-height: 1.7; }
  .phase li b { font-weight: 700; }

  @media (max-width: 480px) {
    header.top { padding: 14px 16px; }
    main { padding: 24px 14px 60px; }
  }
</style>
</head>
<body>

<nav class="tabs" id="tabs"></nav>

<main id="panels"></main>

<script>
const TABS = [
  { id: "lead-gen", label: "Lead Gen" },
  { id: "pipeline", label: "Pipeline" },
  { id: "lead-mgmt", label: "Lead Management" },
  { id: "properties", label: "Properties & Matching" },
  { id: "calendar", label: "Calendar & Scheduling" },
  { id: "team", label: "Team" },
  { id: "analytics", label: "Analytics" },
  { id: "messaging", label: "Messaging & AI" },
  { id: "scoring", label: "LPMAMA Scoring" },
  { id: "concierge", label: "Concierge Service" },
  { id: "compliance", label: "Compliance & Hosting" },
  { id: "mobile", label: "Mobile" },
  { id: "roadmap", label: "Roadmap" },
];

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

TABS.forEach((t, i) => {
  const btn = document.createElement("button");
  btn.textContent = t.label;
  btn.setAttribute("role", "tab");
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.addEventListener("click", () => selectTab(t.id));
  btn.id = "tabbtn-" + t.id;
  tabsEl.appendChild(btn);
});

const POSTERS = {
  "create-lead": "02-requirements-filled.png",
  "dashboard-tour": "01-board-overview.png",
  "drag-pipeline": "02-after-drag.png",
  "lead-detail": "01-lead-detail-top.png",
  "edit-lead": "02-budget-updated.png",
  "assign-agent": "03-agent-assigned.png",
  "analytics": "01-analytics-top.png",
  "team-roster": "01-team-roster.png",
  "properties-browse": "01-portfolio-grid.png",
  "create-property": "06-portfolio-with-new-listing.png",
  "property-detail": "01-property-detail-top.png",
  "property-matching": "01-matched-properties.png",
  "schedule-showing": "02-step2-date-details.png",
  "calendar-view": "01-calendar-month.png",
  "compose-message": "03-ai-draft-ready.png",
};

function clip(slug, title, caption) {
  const poster = `${slug}/screens/${POSTERS[slug]}`;
  return `
    <div class="clip">
      <h3>${title}</h3>
      <video controls preload="metadata" poster="${poster}" playsinline muted>
        <source src="${slug}/video.mp4" type="video/mp4">
      </video>
      <p class="cap">${caption}</p>
    </div>`;
}

function panelHTML(id) {
  switch (id) {
    case "lead-gen": return `
      <div class="panel-head">
        <p class="eyebrow">Lead Gen</p>
        <h1>Every new inquiry captured in full, in under a minute</h1>
        <p>The first few minutes after a lead comes in decide whether your agency keeps it or loses it to whoever responds first. Closr's intake form asks for what actually matters: budget, timeline, property type, and location, with a live address lookup instead of a free-text field someone has to clean up later. Nothing here is busywork. Every field feeds straight into LPMAMA scoring and the matching engine, so a lead is qualified and matched the moment it's created, not hours later when someone finally gets around to it.</p>
      </div>
      ${clip("create-lead", "Creating a lead", "The full intake flow: identity, budget, property type, and a live address search, start to finish.")}
    `;
    case "pipeline": return `
      <div class="panel-head">
        <p class="eyebrow">Pipeline</p>
        <h1>One board, nine stages, nothing hidden</h1>
        <p>Nine pipeline stages map to how a real deal actually moves, from New through Converted, so the board reads the same way your team already talks about a deal. Filter down to just the stages you're working today, or switch to a compact view to scan the whole flow at once. Moving a lead forward is a single drag between columns, not a status dropdown buried three clicks deep, which is exactly why agents actually keep it current instead of letting it drift out of sync with reality.</p>
      </div>
      ${clip("dashboard-tour", "The pipeline board", "Filtering stages and switching between full and compact views.")}
      ${clip("drag-pipeline", "Moving a deal forward", "A real drag between pipeline stages, confirmed by the app itself.")}
    `;
    case "lead-mgmt": return `
      <div class="panel-head">
        <p class="eyebrow">Lead Management</p>
        <h1>Everything about a lead, without switching tools</h1>
        <p>Contact info, budget and requirements, matched listings, follow-up reminders, and full history sit on one page. That matters because the alternative, a spreadsheet for details, a separate calendar for the next follow-up, a notes app for what was last said, is exactly how leads get dropped. Editing a lead updates the same record everyone else sees. Reassigning it to a different agent takes one search and one click, so ownership is never ambiguous.</p>
      </div>
      ${clip("lead-detail", "Lead detail view", "Contact info, requirements, and follow-up tools together on one page.")}
      ${clip("edit-lead", "Editing a lead", "The same intake form, pre-filled, for keeping a lead's details accurate as things change.")}
      ${clip("assign-agent", "Assigning ownership", "Searching the team and reassigning a lead in one click.")}
      <div class="callout"><p>On the web, contact info lives directly on the lead record, no separate contacts list to keep in sync by hand. The mobile app goes further with a full contacts list that cross-links back to leads both ways.</p></div>
    `;
    case "properties": return `
      <div class="panel-head">
        <p class="eyebrow">Properties &amp; Matching</p>
        <h1>List once, let the matching engine do the cross-referencing</h1>
        <p>A portfolio only helps if agents remember to check it against every lead, and a lead list only helps if someone remembers to check it against every new listing. Closr's matching engine does both automatically. The moment a property or a lead is added, it's checked against everything on the other side on price, location, and property type, and the fit shows up as a score, not a hunch. That turns "let me see if I have anything for you" into an answer that's already waiting when the lead calls back.</p>
      </div>
      ${clip("properties-browse", "Browsing the portfolio", "Searching and sorting across every active listing.")}
      ${clip("create-property", "Listing a property", "Basic info, pricing, the same address lookup used for leads, and a photo gallery.")}
      ${clip("property-matching", "The matching engine", "A lead checked against the portfolio automatically, with a scored result.")}
      ${clip("property-detail", "Property detail view", "Price, photos, and the full description in one view.")}
    `;
    case "calendar": return `
      <div class="panel-head">
        <p class="eyebrow">Calendar &amp; Scheduling</p>
        <h1>A booked showing is the strongest signal a lead can give you</h1>
        <p>In the LPMAMA framework, a booked appointment is rated the single strongest qualification signal there is, ahead of budget and ahead of urgency. Scheduling can't be an afterthought in a separate calendar app disconnected from the lead record. Book a showing straight from the lead: pick a property, set a time with a quick shortcut or an exact date, and it lands on one shared calendar the whole team can see, organized by day and by lead.</p>
      </div>
      ${clip("schedule-showing", "Scheduling a showing", "Picking a property, then setting the date, time, and duration.")}
      ${clip("calendar-view", "The showings calendar", "Every showing across every lead, laid out by month.")}
    `;
    case "team": return `
      <div class="panel-head">
        <p class="eyebrow">Team</p>
        <h1>Brokers see the whole floor. Agents see their own desk.</h1>
        <p>A brokerage isn't one person working one pipeline. It's several agents each working their own leads inside a pipeline the broker needs to see across all of them at once. Every member shows up on one roster with their role and status. Brokers and admins get visibility across the entire team's activity: who's assigned what, where every lead sits in the pipeline, and how the whole book is performing, not just their own deals. Agents work what's assigned to them. Reassigning a lead from one agent to another, when someone's out, when a deal needs a specialist, when the team is rebalancing, is a search and a click, not a conversation with support.</p>
      </div>
      ${clip("team-roster", "Team roster", "Members, roles, and status at a glance.")}
    `;
    case "analytics": return `
      <div class="panel-head">
        <p class="eyebrow">Analytics</p>
        <h1>What a spreadsheet can't tell you fast enough</h1>
        <p>Total and active leads, plus a live conversion rate, give a broker a health check without opening a single spreadsheet. Hotness distribution shows how many leads are actually ready to move right now versus how many just look busy on the board, so the team knows where to spend the next hour. Pipeline mix shows where deals are piling up: if half your leads are stuck at Contacted, that's worth knowing today, not at quarter end. Budget-versus-property-price comparisons show whether you're losing leads because there's genuinely no inventory in their range. Trend and geographic charts show whether volume is growing, shrinking, or shifting to a new area, so acquisition spend can follow actual demand instead of a hunch.</p>
      </div>
      ${clip("analytics", "Analytics dashboard", "Totals, hotness distribution, pipeline mix, and trends over time.")}
    `;
    case "messaging": return `
      <div class="panel-head">
        <p class="eyebrow">Messaging &amp; AI</p>
        <h1>The blank message box is where follow-ups die</h1>
        <p>Response speed is one of the best-documented conversion levers in real estate, and the thing that slows an agent down most isn't typing, it's not knowing what to say. Closr drafts a starting point pulled from what the lead actually told you (their budget, property type, and location), not a generic template, so the agent reviews and sends instead of staring at an empty box. Nothing goes out without a human reading it first. That review step isn't a setting someone could switch off under deadline pressure. It's how sending is built.</p>
      </div>
      ${clip("compose-message", "Composing a message", "An AI-drafted starting point, reviewed before it's sent.")}
      <div class="feature-list" style="margin-top:8px;">
        <div class="feature-row"><span class="n">01</span><div><h4>Draft replies<span class="status shipped">Shown above</span></h4><p>Email and SMS, personalized to the lead's actual requirements, ready to review and send. Not a canned template.</p></div></div>
        <div class="feature-row"><span class="n">02</span><div><h4>Call transcripts &amp; summaries<span class="status roadmap">Roadmap</span></h4><p>Every call recapped automatically, with action items filed straight into the pipeline instead of left in someone's memory.</p></div></div>
        <div class="feature-row"><span class="n">03</span><div><h4>Qualification assist<span class="status roadmap">Roadmap</span></h4><p>LPMAMA signals pulled from the actual conversation, so a score updates from what was really said, not just what got typed into a form.</p></div></div>
        <div class="feature-row"><span class="n">04</span><div><h4>Smart scheduling<span class="status roadmap">Roadmap</span></h4><p>Showings proposed and booked around both calendars automatically, cutting out the back-and-forth to find a time that works.</p></div></div>
        <div class="feature-row"><span class="n">05</span><div><h4>Market briefs<span class="status roadmap">Roadmap</span></h4><p>A quick comparable-sales summary drafted before every listing appointment, so prep time shrinks from an hour to a read-through.</p></div></div>
        <div class="feature-row"><span class="n">06</span><div><h4>Urgency detection<span class="status roadmap">Roadmap</span></h4><p>Flags a cooling lead before it goes cold, not after, while there's still time to do something about it.</p></div></div>
      </div>
    `;
    case "scoring": return `
      <div class="panel-head">
        <p class="eyebrow">Scoring Engine</p>
        <h1>A benchmark your team already trusts, not a black box</h1>
        <p>LPMAMA isn't something Closr invented. It's a qualification framework real estate agents have trained on for years, long before any CRM tried to automate it. That matters more than it sounds like it should: when a new tool forces a team to learn a whole new scoring philosophy, adoption stalls, because nobody trusts a number they don't understand. A LPMAMA score means the same thing to an agent on day one as it does a year in. There's no ramp-up and nothing to take on faith.</p>
        <p>The score is rules-based, not a generative-AI guess. If a lead scores 40 instead of 80, an agent can see exactly which factor is pulling it down (no booked appointment yet, an unclear budget, no urgency) and knows precisely what to ask on the next call. A model that just outputs a number can't be interrogated the same way, and confidence in a score nobody can explain erodes fast. An agent needs to be able to defend a priority call to a broker, and "the AI said so" isn't a defense.</p>
        <p>Six factors is a deliberate choice, not a limitation. A cash buyer with a booked showing is obviously closer to closing than someone still deciding on a neighborhood, and it doesn't take forty data points to know that. A scoring system only creates value if the team actually looks at it and acts on it every day, and a simple, explainable number is what gets used. A sophisticated model nobody fully trusts just gets ignored.</p>
      </div>
      <div class="grid3">
        <div class="cell"><div class="letter">L</div><h4>Location</h4><p>Specific neighborhood preference, or open to anything.</p></div>
        <div class="cell"><div class="letter">P</div><h4>Price</h4><p>A narrow, certain budget scores far higher than a wide, unsure one.</p></div>
        <div class="cell"><div class="letter">M</div><h4>Motivation</h4><p>Urgency is one of the strongest signals.</p></div>
        <div class="cell"><div class="letter">A</div><h4>Agent status</h4><p>Already working with another agent, or a real open opportunity.</p></div>
        <div class="cell"><div class="letter">M</div><h4>Mortgage</h4><p>Cash buyer or pre-approved moves fast.</p></div>
        <div class="cell"><div class="letter">A</div><h4>Appointment</h4><p>A booked viewing is the single strongest signal.</p></div>
      </div>
      <div class="callout"><p>The single aggregate score is visible today throughout Lead Management and Analytics. A factor-by-factor breakdown view is on the roadmap.</p></div>
    `;
    case "concierge": return `
      <div class="panel-head">
        <p class="eyebrow">Concierge Service</p>
        <h1>The difference between buying software and getting a team</h1>
        <p>Most CRM switches fail quietly. Not because the software is bad, but because nobody has the hours to migrate years of spreadsheet data, configure a new pipeline, and keep chasing the leads that go quiet, on top of an already full day of actual selling. Concierge exists to remove that cost entirely, so switching to Closr costs your team time up front, not months of half-finished setup.</p>
      </div>
      <div class="feature-list">
        <div class="feature-row"><span class="n">01</span><div><h4>Migration, handled for you</h4><p>Your existing spreadsheet or CRM export gets cleaned up and brought into Closr by a person, not a self-serve import tool you have to figure out. Day one looks like day four hundred, fully populated, not an empty board you have to build up from nothing. This is usually the single biggest reason a switch to new software gets postponed indefinitely, and here it's simply done for you.</p></div></div>
        <div class="feature-row"><span class="n">02</span><div><h4>A real person through setup, not a ticket queue</h4><p>Getting the pipeline, the team, and the first batch of listings configured usually means weeks of trial and error, or a support ticket that sits for days. Concierge sits with you through it, so what would take weeks on your own takes days with someone who already knows the product.</p></div></div>
        <div class="feature-row"><span class="n">03</span><div><h4>Cold-lead reminders before the lead goes cold</h4><p>The most expensive leak in any pipeline isn't a lead that says no. It's the one that just goes quiet because nobody was watching closely enough to notice. A proactive nudge catches it while there's still time to save it, instead of weeks later when it's already gone to a competitor.</p></div></div>
        <div class="feature-row"><span class="n">04</span><div><h4>Portfolio upkeep that isn't competing with selling time</h4><p>Price changes, status updates, new inventory: keeping a portfolio current is real work that eats into hours an agent could spend with a client instead. Handing that upkeep off gives that time back to the people actually closing deals.</p></div></div>
        <div class="feature-row"><span class="n">05</span><div><h4>Listings brought in, not chased down one portal at a time</h4><p>Instead of an agent checking five different sites for inventory that might fit a specific lead, rentals, lettings, and listings from other sources get sourced and added to your portfolio on your behalf.</p></div></div>
      </div>
      <div class="callout"><p>A white-glove option alongside the self-serve product. If your team is migrating off a spreadsheet or another CRM, this is usually where the time savings shows up first, before the software itself even enters the picture. Ask your Closr contact whether it fits your team.</p></div>
    `;
    case "compliance": return `
      <div class="panel-head">
        <p class="eyebrow">Security &amp; Compliance</p>
        <h1>Trusted with client data by design</h1>
        <p>Client financial details, contact information, and communication history are exactly the kind of data a brokerage can't afford to be careless with. These aren't settings a team has to remember to turn on. They're how the product is built.</p>
      </div>
      <div class="feature-list">
        <div class="feature-row"><span class="n">01</span><div><h4>Encrypted everywhere</h4><p>Data encrypted at rest and in transit, no exceptions. Client information never sits in the clear, whether it's stored or moving between systems.</p></div></div>
        <div class="feature-row"><span class="n">02</span><div><h4>Audit trail by default</h4><p>Every status change, match, and AI suggestion is logged, not just the final outcome. If a broker needs to know exactly what happened on a deal and when, the record already exists instead of having to be reconstructed from memory.</p></div></div>
        <div class="feature-row"><span class="n">03</span><div><h4>Human-in-the-loop, enforced</h4><p>No AI-drafted message reaches a client without an agent's sign-off. That's not a setting someone could switch off under deadline pressure. It's built into how sending works.</p></div></div>
        <div class="feature-row"><span class="n">04</span><div><h4>Hosting that fits your market</h4><p>US-hosted today, with UK-region infrastructure available for teams that need in-region data residency, relevant for brokerages operating under UK data protection requirements.</p></div></div>
      </div>
    `;
    case "mobile": return `
      <div class="panel-head">
        <p class="eyebrow">Mobile</p>
        <h1>The full CRM, built for between showings, not a desk</h1>
        <p>An agent's day doesn't happen at a desk. It happens in a car, on a doorstep, between showings with spotty signal. Closr's mobile app, for iOS and Android, isn't a cut-down companion to the web product. It carries the same pipeline, leads, properties, analytics, calendar, and messaging, plus a few things a desktop browser simply can't do.</p>
      </div>
      <div class="feature-list">
        <div class="feature-row"><span class="n">01</span><div><h4>Capture a lead by talking, not typing</h4><p>Speak a new lead's details out loud right after a call or a doorstep conversation, and the app transcribes it and structures it into a lead automatically, budget, property type, and all. No pulling over to type into a form while the details are still fresh.</p></div></div>
        <div class="feature-row"><span class="n">02</span><div><h4>Works without signal</h4><p>Leads, properties, messages, and showings are cached on the device, so the app stays usable in a basement showing or a rural listing with no bars, and syncs automatically the moment the connection comes back.</p></div></div>
        <div class="feature-row"><span class="n">03</span><div><h4>Photos straight from a showing</h4><p>Capture property or lead photos directly from the camera on site, instead of shooting them on a phone and transferring them to a desktop later.</p></div></div>
        <div class="feature-row"><span class="n">04</span><div><h4>A push the moment a hot lead replies</h4><p>Real-time push notifications mean a reply doesn't sit unread for hours until someone happens to open the app.</p></div></div>
        <div class="feature-row"><span class="n">05</span><div><h4>Privacy shield</h4><p>The screen blurs automatically the moment the app is backgrounded, so client details aren't visible on a phone left face-up on a car seat or a desk.</p></div></div>
        <div class="feature-row"><span class="n">06</span><div><h4>Team and billing, without opening a laptop</h4><p>Manage team members and your account plan directly from the app. Nothing about running the business requires switching to a desktop.</p></div></div>
      </div>
      <div class="callout"><p>All of this ships in the same app as the core pipeline, not a separate download. Ask your Closr contact for access to try it.</p></div>
    `;
    case "roadmap": return roadmapHTML();
  }
}

function roadmapHTML() {
  const phases = [
    {
      num: "1", title: "Growth infrastructure", when: "Near-term",
      goal: "A real marketing presence and easier ways for agents to bring their own network in, so growing the team doesn't depend on word of mouth alone.",
      items: [
        ["A real marketing site, built around the actual buyer", "Right now finding and evaluating Closr is harder than it should be. A proper site means a broker can send a partner or a new hire a link instead of a screen-share, with real answers to the questions an agency actually asks before switching tools."],
        ["A referral program", "Agents already talk to other agents, and word of mouth is how most agencies actually pick a CRM. A structured referral path turns that existing behavior into growth, instead of leaving it to chance."],
        ["Lightweight integrations (Zapier, Make)", "Most agencies already run a small stack of other tools around their CRM. Simple integrations mean Closr can slot into whatever else your team uses today, transaction management, email marketing, accounting, instead of requiring a full switch away from any of it."],
      ],
    },
    {
      num: "2", title: "Core product depth", when: "Near-term",
      goal: "Feeding the matching engine from both sides, more leads in, more inventory to match against, across both the US and UK markets, so the automatic matching you've already seen gets sharper and covers more ground over time.",
      items: [
        ["Automated lead ingestion from major portals", "Instead of copying names out of five different portal alerts every morning, leads from Zillow and Realtor.com in the US, Zoopla in the UK, plus Facebook and Instagram lead ads, land directly in the pipeline, already deduplicated against existing leads so nobody works the same inquiry twice."],
        ["MLS/IDX property sync in the US, Zoopla and Rightmove feeds in the UK", "Portfolio inventory stays current automatically on both sides of the Atlantic, instead of depending on someone remembering to hand-enter every new listing or rekey it for a second market."],
        ["Lettings and rentals support for the UK market", "UK agencies run lettings alongside sales as a core part of the business, not a side case. Bringing rental and letting inventory into the same portfolio and matching engine as sales listings means a UK agency isn't forced into a separate tool just to manage that half of the book."],
        ["A feedback loop on match quality", "Agents flag whether a suggested match was actually a good one, so the matching engine gets better at your specific market, price band, and inventory mix, not just in general."],
        ["A team and brokerage tier with routing and commission tracking", "Lead routing rules and commission-split tracking extend the broker-level visibility already in the product today, built for agencies that are scaling past a handful of agents and need rules, not manual reassignment, to keep leads flowing to the right person."],
      ],
    },
    {
      num: "3", title: "AI voice layer", when: "Mid-term",
      goal: "A native phone channel. Real estate runs on calls, and right now none of that conversation is visible to the CRM once the call ends.",
      items: [
        ["Inbound and outbound calling, with recording and consent handling", "Calls happen inside the same record as everything else, with consent handling built in from the start rather than bolted on later."],
        ["Call transcription and summaries", "A recap and action items land in the pipeline automatically after every call, so nothing said on the phone gets lost the moment it ends."],
        ["Draft-and-approve follow-ups after every call", "A suggested next message, based on what was actually discussed, waiting for the agent to review and send."],
        ["Broker-level coaching insights from the same call data", "Talk-time ratios and objection patterns surfaced to a broker or team lead, using data that already exists instead of asking agents to self-report."],
      ],
    },
    {
      num: "4", title: "Mobile, next steps", when: "Ongoing, in parallel",
      goal: "The mobile app already covers voice-to-lead capture, offline access, and push notifications today. These are the next layer on top of that.",
      items: [
        ["Biometric login", "Faster, more secure access in the field than typing a password on a touchscreen between appointments."],
        ["Location-aware showing check-ins", "A showing that logs itself the moment an agent arrives on site, one less thing to remember to do manually after a long day."],
      ],
    },
    {
      num: "5", title: "Scale and ecosystem", when: "Longer-term",
      goal: "Extending outward into the rest of an agency's toolchain once the core pipeline is proven at your scale.",
      items: [
        ["An integrations marketplace (DocuSign, transaction management, accounting)", "Contract, transaction, and commission data stop living in three disconnected tools that all need the same information typed in three times."],
        ["Multi-market and multi-MLS expansion", "Support for agencies operating across more than one market or MLS board, without splitting the pipeline across separate tools."],
        ["A white-label tier for larger brokerages", "A brokerage-branded instance for larger accounts that want the product under their own name."],
      ],
    },
  ];
  return `
    <div class="panel-head">
      <p class="eyebrow">Roadmap</p>
      <h1>Where Closr is headed</h1>
      <p>Built for the independent agent and the growing agency first, not retrofitted from an enterprise tool nobody in real estate actually asked for.</p>
    </div>
    ${phases.map(p => `
      <div class="phase">
        <div class="phase-head">
          <span class="phase-num">${p.num}</span>
          <h3>${p.title}</h3>
          <span class="phase-when">${p.when}</span>
        </div>
        <p class="phase-goal">${p.goal}</p>
        <ul>${p.items.map(([title, why]) => `<li><b>${title}.</b> ${why}</li>`).join("")}</ul>
      </div>
    `).join("")}
  `;
}

TABS.forEach((t, i) => {
  const div = document.createElement("div");
  div.className = "panel" + (i === 0 ? " active" : "");
  div.id = "panel-" + t.id;
  div.innerHTML = panelHTML(t.id);
  panelsEl.appendChild(div);
});

function selectTab(id) {
  TABS.forEach(t => {
    document.getElementById("tabbtn-" + t.id).setAttribute("aria-selected", t.id === id ? "true" : "false");
    document.getElementById("panel-" + t.id).classList.toggle("active", t.id === id);
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}
</script>
</body>
</html>
